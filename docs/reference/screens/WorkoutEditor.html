<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #0f0a0c; color: #ffffff; font-family: 'Lexend Deca', system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased">

</div><main style="padding: 32px 24px 200px; display: flex; flex-direction: column"><div style="border-radius: 16px; background: #141414; box-shadow: inset 0 2px 0 rgba(255,255,255,0.08); padding: 8px 0; display: flex; flex-direction: column"><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 16px"><span style="color: #a6a1a3; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.75"></path></svg></span>

</div><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 16px"><span style="color: #a6a1a3; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.75"></path></svg></span>

</div><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 16px"><span style="color: #a6a1a3; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.75"></path></svg></span>

</div><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 16px"><span style="color: #a6a1a3; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.75"></path></svg></span>

</div><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 16px"><span style="color: #a6a1a3; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.75"></path></svg></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="display: flex; align-items: center; gap: 8px; font-size: 18px; line-height: 24px; letter-spacing: -0.02em; color: #ffffff">Treadmill walk</span><span style="font-size: 13px; line-height: 16px; color: #a6a1a3">10 min · 6,0 km/h</span></div><span style="color: #a6a1a3; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m9 6 6 6-6 6"></path></svg></span>
</div></div><div style="height: 16px"></div><div style="border-radius: 16px; background: #141414; box-shadow: inset 0 2px 0 rgba(255,255,255,0.08); padding: 16px; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; align-items: center; gap: 12px"><span style="flex-grow: 1; font-size: 16px; line-height: 22px; color: #ffffff">Hide from home</span><span role="switch" aria-checked="false" style="position: relative; width: 52px; height: 32px; flex-shrink: 0; border-radius: 999px; background: #1c1c1c; box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), inset 0 -1px 0 rgba(0,0,0,0.35)"><span style="position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 999px; background: #a6a1a3"></span></span></div></div></main><div style="position: absolute; left: 0; right: 0; bottom: 88px; padding: 16px 24px; background: #0f0a0c"><button style="width: 100%; min-height: 56px; padding: 0 24px; border: 0; border-radius: 16px; background: #e901c4; box-shadow: inset 0 2px 0 rgba(255,255,255,0.75), inset 0 -2px 0 rgba(0,0,0,0.32); color: #000000; font-family: inherit; font-size: 17px; line-height: 24px; font-weight: 400; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 5v14M5 12h14"></path></svg>Add exercise</button></div><nav style="position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 24px 24px; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; background: #0f0a0c"><button style="border: 0; background: transparent; border-radius: 16px; height: 56px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #a6a1a3; font-size: 12px; line-height: 16px; font-weight: 400"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</button><button aria-current="page" style="border: 0; background: #3e192b; box-shadow: inset 0 2px 0 rgba(255,255,255,0.12), inset 0 -2px 0 rgba(0,0,0,0.35); border-radius: 16px; height: 56px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #ff4fdb; font-size: 12px; line-height: 16px; font-weight: 400"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"></path></svg>Workouts</button><button style="border: 0; background: transparent; border-radius: 16px; height: 56px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #a6a1a3; font-size: 12px; line-height: 16px; font-weight: 400"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5M12 7v5l3 2"></path></svg>History</button><button style="border: 0; background: transparent; border-radius: 16px; height: 56px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #a6a1a3; font-size: 12px; line-height: 16px; font-weight: 400"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 3v18h18"></path><path d="M8 17v-5M13 17V8M18 17v-9"></path></svg>Progress</button></nav>
